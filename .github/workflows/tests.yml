name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite, json, tokenizer, xml, curl, zip

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint for deprecations
        run: |
          out=$(find src -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=E_ALL -d display_errors=1 -l 2>&1 | grep -v 'No syntax errors' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Run tests
        run: vendor/bin/phpunit